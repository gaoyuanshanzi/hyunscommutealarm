<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#131b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0077ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="180" fill="none" stroke="#00d4ff" stroke-width="8" stroke-dasharray="16 16" opacity="0.3"/>
  <circle cx="256" cy="256" r="120" fill="rgba(0, 212, 255, 0.08)" stroke="#00d4ff" stroke-width="12" opacity="0.8"/>

  <!-- Center Pin & Bell Icon -->
  <circle cx="256" cy="220" r="54" fill="url(#accent)" filter="url(#glow)"/>
  <path d="M256 185 c-16 0 -30 14 -30 30 c0 20 30 50 30 50 s30 -30 30 -50 c0 -16 -14 -30 -30 -30 z" fill="#ffffff"/>
  <circle cx="256" cy="215" r="10" fill="url(#accent)"/>

  <!-- Wave Lines -->
  <path d="M190 320 Q256 350 322 320" fill="none" stroke="#00d4ff" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
  <path d="M160 350 Q256 390 352 350" fill="none" stroke="#00d4ff" stroke-width="6" stroke-linecap="round" opacity="0.5"/>
</svg>
